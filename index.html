<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="imagens/PonyExpressLogoTransparent.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>MISSÃO AURA</title>
  </head>
  <body>
    <main>
        <div id="tela_login">
         <form id="form" action="javascript:void(0)" method="get">
            <div id="info">
              <label for="nome">Qual seu nome?</label>
              <input type="text" id="nome" name="nome" placeholder="Digite sua senha...">
              <label for="data">Qual sua data de nascimento?</label>
              <input type="date" id="data" name="data" >
            </div>
            <div>
                <label for="perguntas">1. Qual atividade você exerce?</label>
                <select id="q1" placeholder="---">
                    <option>---</option>
                    <option value="1">Medicina</option>
                    <option value="2">Mecânica</option>
                    <option value="3">Administramento</option>
                    <option value="4">Co-administramento</option>
                    <option value="5">Ajudante</option>
                </select>
                <label for="">2. Se encontrasse em uma situação fatal, o quê faria?</label>
                <select id="q2" value="---">
                    <option>---</option>
                    <option value="1">Cuidaria de todos</option>
                    <option value="5">Protegeria quem eu posso</option>
                    <option value="2">Aproveitaria meus últimos momentos</option>
                    <option value="3">Tentaria salvar a nave</option>
                    <option value="4">Concertaria meus erros</option>
                </select>  
                <label for="">3. Como passaria seu tempo?</label>
                <select id="q3" value="---">
                    <option>---</option>
                    <option value="1">Observando os painéis</option>
                    <option value="2">Comendo e bebendo</option>
                    <option value="3">Não tenho tempo para descansar</option>
                    <option value="5">Aprendendo com os outros</option>
                    <option value="4">Pensaria nas coisas que eu gosto</option>
                </select>
                <label for="">4. O que mais te atrai? </label>
                <select id="q4" value="---">
                    <option>---</option>
                    <option value="1">Anatomia humana, infectologia, enfermagem.</option>
                    <option value="2">Exploração, Manutenção de veículos.</option>
                    <option value="3">Cooperação, Administramento, Pilotagem. </option>
                    <option value="4">Exportação de produtos. </option>
                    <option value="5">Lideragem.</option>
                </select>
            </div>
          <button type="submit" id="login">ENTRAR</button>
         </form>
        </div>
        <div id="resultado" class="resultado" aria-live="polite" hidden></div>
     <button id="refazer" type="button" hidden>Refazer o teste</button>
    </main>
     <div id="overlay"></div>
    <script src="script.js"></script>
  </body>
</html>
